# For a description of available keys, see https://github.com/typst/packages/?tab=readme-ov-file#package-format

[package]
name = "reshikist"
version = "0.3.2"
entrypoint = "lib.typ"
authors = ["Abraham Mendoza"]
license = "MIT OR Apache-2.0"
description = "Typst plugin for rendering chemical structure drawings from RSK, SMILES, MOL, CDXML, and more"
repository = "https://gitlab.com/amlab-icmol2/typst/reshikist"
keywords = ["reshiki", "chemistry", "molecule", "svg", "wasm", "smiles", "cdxml", "mol"]
categories = ["visualization"]
disciplines = ["chemistry"]
compiler = "0.14.2"
exclude = [
  ".github",
  "scripts",
  ".typstignore",
  "Justfile",
  "CHANGELOG.md",
]
